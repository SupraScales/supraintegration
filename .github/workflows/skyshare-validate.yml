name: SkyShare Gate Ledger Validation

on:
  push:
    branches:
      - codex/skyshare-staging-gate-ledger

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyshare-tsc-log
          path: tsc.log
      - run: npm run lint
      - run: npm run build
